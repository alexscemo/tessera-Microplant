# What tools/preview.py shows (docs/PREVIEW.md of the plugins repository). The first tile shows the plugin best: a
# Monstera of Plant Monitor, whose sensors, readings and ranges come from the plant (plant/get_info).
time_zone: Europe/London

tiles:
  - tile: plant
    name: Monstera
    entity: plant.monstera
    options:
      watered_entity: input_datetime.monstera_watered
  # Home Assistant's old plant integration: every reading an attribute of one entity, the soil far too wet.
  - tile: plant
    name: Ficus
    entity: plant.ficus
    sizes: [2x2, 1x1]
  # A template sensor (or a RESTful sensor of a local API) with the readings as attributes: thirsty.
  - tile: plant
    name: Pothos
    entity: sensor.pothos
    sizes: [2x1, 1x2]
  # No entity chosen yet: the demo plant.
  - tile: plant
    name: New plant
    sizes: [2x3, 1x1]

states:
  plant.monstera:
    state: ok
    attributes: { friendly_name: Monstera, species: Monstera deliciosa, moisture_status: ok }
  plant.ficus:
    state: problem
    attributes: { friendly_name: Ficus, moisture: 84, temperature: 21.0, brightness: 9000, conductivity: 900 }
  sensor.pothos:
    state: "22"
    attributes:
      friendly_name: Pothos
      unit_of_measurement: "%"
      moisture: 22
      temperature: 21.4
      humidity: 52
      illuminance: 4300
      watered_at: "{epoch-6d}"

commands:
  # The tile's poll of its watering helper: its state at the start of the last minute.
  "history/history_during_period":
    input_datetime.monstera_watered: [{ s: "2026-10-11 08:30:00", a: { timestamp: 1791703800 }, lu: 1791703800 }]
  # Plant Monitor's plant: Home Assistant's answer, {"result": {...}}.
  "plant/get_info":
    result:
      moisture: { max: 60, min: 15, current: "48", icon: "mdi:water", unit_of_measurement: "%", sensor: sensor.monstera_soil_moisture }
      temperature: { max: 30, min: 12, current: "22.4", icon: "mdi:thermometer", unit_of_measurement: "°C", sensor: sensor.monstera_temperature }
      illuminance: { max: 35000, min: 1500, current: "8200", icon: "mdi:brightness-6", unit_of_measurement: lx, sensor: sensor.monstera_illuminance }
      humidity: { max: 70, min: 30, current: "55", icon: "mdi:water-percent", unit_of_measurement: "%", sensor: sensor.monstera_air_humidity }
      conductivity: { max: 2000, min: 350, current: "900", icon: "mdi:spa-outline", unit_of_measurement: "µS/cm", sensor: sensor.monstera_conductivity }
  # A reading's card: the soil's hourly means alone (the bench gives every card this one answer, so more sensors would
  # mix in one chart; Home Assistant answers for the one sensor asked), in Home Assistant's own shape (the manifest's
  # `answers` maps it).
  "recorder/statistics_during_period":
    sensor.monstera_soil_moisture:
      - { start: 1791913560000, end: 1791917160000, mean: 63.1 }
      - { start: 1791917160000, end: 1791920760000, mean: 61.8 }
      - { start: 1791920760000, end: 1791924360000, mean: 60.2 }
      - { start: 1791924360000, end: 1791927960000, mean: 59.0 }
      - { start: 1791927960000, end: 1791931560000, mean: 57.7 }
      - { start: 1791931560000, end: 1791935160000, mean: 56.9 }
      - { start: 1791935160000, end: 1791938760000, mean: 55.4 }
      - { start: 1791938760000, end: 1791942360000, mean: 54.6 }
      - { start: 1791942360000, end: 1791945960000, mean: 53.3 }
      - { start: 1791945960000, end: 1791949560000, mean: 52.5 }
      - { start: 1791949560000, end: 1791953160000, mean: 51.6 }
      - { start: 1791953160000, end: 1791956760000, mean: 50.8 }
      - { start: 1791956760000, end: 1791960360000, mean: 50.1 }
      - { start: 1791960360000, end: 1791963960000, mean: 49.5 }
      - { start: 1791963960000, end: 1791967560000, mean: 49.0 }
      - { start: 1791967560000, end: 1791971160000, mean: 48.6 }

cards:
  - { card: metric, entity: sensor.monstera_soil_moisture }
