# What tools/preview.py shows (docs/PREVIEW.md of the plugins repository). The first tile shows the plugin best: a
# Monstera whose soil sensor is the tile's entity, with its temperature, humidity and light polled through the app.
time_zone: Europe/London

tiles:
  - tile: plant
    name: Monstera
    entity: sensor.monstera_soil_moisture
    options:
      temperature_entity: sensor.monstera_temperature
      humidity_entity: sensor.living_room_humidity
      light_entity: sensor.monstera_illuminance
      watered_entity: input_datetime.monstera_watered
  # Home Assistant's Plant Monitor: every reading an attribute of one entity, the soil far too wet.
  - tile: plant
    name: Ficus
    entity: plant.ficus
    sizes: [2x2, 1x1]
  # A template sensor (or a RESTful sensor of a local API) with the readings as attributes: thirsty.
  - tile: plant
    name: Pothos
    entity: sensor.pothos
    sizes: [2x1, 1x2]
  # No entity chosen yet: the demo plant.
  - tile: plant
    name: New plant
    sizes: [2x3, 1x1]

states:
  sensor.monstera_soil_moisture:
    state: "48"
    attributes: { friendly_name: Monstera soil moisture, unit_of_measurement: "%", state_class: measurement }
  plant.ficus:
    state: problem
    attributes: { friendly_name: Ficus, moisture: 84, temperature: 21.0, brightness: 9000, conductivity: 900 }
  sensor.pothos:
    state: "22"
    attributes:
      friendly_name: Pothos
      unit_of_measurement: "%"
      moisture: 22
      temperature: 21.4
      humidity: 52
      illuminance: 4300
      watered_at: "{epoch-6d}"

commands:
  # The tile's poll: the state of each sensor of its options at the start of the last minute.
  "history/history_during_period":
    sensor.monstera_temperature: [{ s: "22.4", a: { unit_of_measurement: "°C" }, lu: 1791999930 }]
    sensor.living_room_humidity: [{ s: "55", a: { unit_of_measurement: "%" }, lu: 1791999930 }]
    sensor.monstera_illuminance: [{ s: "8200", a: { unit_of_measurement: lx }, lu: 1791999930 }]
    input_datetime.monstera_watered: [{ s: "2026-10-11 08:30:00", a: { timestamp: 1791703800 }, lu: 1791703800 }]
  # A reading's card: hourly means of the last day (Home Assistant's own shape; the manifest's `answers` maps it).
